version: '3.8'

services:
  qingscan:
    build:
      context: ./goCode
      dockerfile: Dockerfile
    image: qingscan:latest
    container_name: qingscan
    ports:
      - "8080:8080"
    volumes:
      - ./goCode/config.yaml:/opt/qingscan/config.yaml
      - ./tools:/opt/qingscan/tools
      - ./output:/var/qingscan/output
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_HOST=mysql
      - REDIS_HOST=redis
      - SCANNER_TOOLS_PATH=/opt/qingscan/tools
      - SCANNER_OUTPUT_DIR=/var/qingscan/output
    depends_on:
      - mysql
      - redis
    networks:
      - qingscan

  mysql:
    image: mysql:8.0
    container_name: qingscan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qingscan
      MYSQL_USER: qingscan
      MYSQL_PASSWORD: qingscan
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - qingscan

  redis:
    image: redis:7
    container_name: qingscan-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - qingscan

volumes:
  mysql_data:
  redis_data:

networks:
  qingscan:
    driver: bridge
