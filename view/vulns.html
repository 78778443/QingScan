<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漏洞管理 - QingScan</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        body { background: #f5f5f5; }
        .navbar { margin-bottom: 20px; }
        .content { background: #fff; padding: 20px; border-radius: 4px; }
        .severity-critical { color: #dc3545; font-weight: bold; }
        .severity-high { color: #fd7e14; font-weight: bold; }
        .severity-medium { color: #ffc107; font-weight: bold; }
        .severity-low { color: #28a745; font-weight: bold; }
        .severity-info { color: #17a2b8; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">QingScan</a>
            <div class="navbar-nav mr-auto">
                <a class="nav-link" href="/">首页</a>
                <a class="nav-link" href="/tasks">任务管理</a>
                <a class="nav-link" href="/hosts">资产发现</a>
                <a class="nav-link active" href="/vulns">漏洞管理</a>
                <a class="nav-link" href="/apps">应用管理</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="content">
            <div class="table-toolbar">
                <div class="btn-group">
                    <button class="btn btn-outline-secondary" onclick="filterBySeverity('')">全部</button>
                    <button class="btn btn-outline-danger" onclick="filterBySeverity('critical')">严重</button>
                    <button class="btn btn-outline-warning" onclick="filterBySeverity('high')">高危</button>
                    <button class="btn btn-outline-info" onclick="filterBySeverity('medium')">中危</button>
                    <button class="btn btn-outline-success" onclick="filterBySeverity('low')">低危</button>
                </div>
            </div>

            <table class="table table-striped" id="vulnTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>漏洞名称</th>
                        <th>目标</th>
                        <th>类型</th>
                        <th>严重程度</th>
                        <th>工具</th>
                        <th>状态</th>
                        <th>发现时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="vulnList"></tbody>
            </table>

            <nav>
                <ul class="pagination" id="pagination"></ul>
            </nav>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var currentPage = 1;
        var currentSeverity = '';
        var token = localStorage.getItem('token');

        if(!token) {
            window.location.href = '/login';
        }

        function loadVulns(page, severity) {
            var url = '/api/vulnerabilities?page=' + page + '&page_size=10';
            if(severity) {
                url += '&severity=' + severity;
            }

            $.get(url, function(res) {
                if(res.code === 0) {
                    renderVulns(res.data.list);
                    renderPagination(res.data.total, res.data.page);
                }
            });
        }

        function renderVulns(vulns) {
            var html = '';
            var statusMap = {0: '<span class="badge badge-secondary">待确认</span>', 1: '<span class="badge badge-success">已确认</span>', 2: '<span class="badge badge-warning">误报</span>', 3: '<span class="badge badge-info">已修复</span>'};

            vulns.forEach(function(vuln) {
                html += '<tr>';
                html += '<td>' + vuln.id + '</td>';
                html += '<td>' + vuln.name + '</td>';
                html += '<td><a href="' + vuln.target + '" target="_blank">' + vuln.target.substring(0, 50) + '</a></td>';
                html += '<td>' + vuln.type + '</td>';
                html += '<td class="severity-' + vuln.severity + '">' + vuln.severity.toUpperCase() + '</td>';
                html += '<td>' + vuln.tool + '</td>';
                html += '<td>' + statusMap[vuln.status] + '</td>';
                html += '<td>' + vuln.created_at + '</td>';
                html += '<td>';
                html += '<button class="btn btn-sm btn-success" onclick="updateStatus(' + vuln.id + ',1)">确认</button> ';
                html += '<button class="btn btn-sm btn-danger" onclick="deleteVuln(' + vuln.id + ')">删除</button>';
                html += '</td></tr>';
            });
            $('#vulnList').html(html);
        }

        function renderPagination(total, page) {
            var pages = Math.ceil(total / 10);
            var html = '';
            for(var i = 1; i <= pages; i++) {
                html += '<li class="page-item ' + (i === page ? 'active' : '') + '"><a class="page-link" href="javascript:loadVulns(' + i + ',\'' + currentSeverity + '\')">' + i + '</a></li>';
            }
            $('#pagination').html(html);
        }

        function filterBySeverity(severity) {
            currentSeverity = severity;
            loadVulns(1, severity);
        }

        function updateStatus(id, status) {
            $.ajax({
                url: '/api/vulnerabilities/' + id,
                method: 'PUT',
                headers: {'Authorization': 'Bearer ' + token},
                contentType: 'application/json',
                data: JSON.stringify({status: status}),
                success: function(res) {
                    if(res.code === 0) {
                        loadVulns(currentPage, currentSeverity);
                    } else {
                        alert(res.msg);
                    }
                }
            });
        }

        function deleteVuln(id) {
            if(confirm('确定要删除这个漏洞吗?')) {
                $.ajax({
                    url: '/api/vulnerabilities/' + id,
                    method: 'DELETE',
                    headers: {'Authorization': 'Bearer ' + token},
                    success: function(res) {
                        if(res.code === 0) {
                            loadVulns(currentPage, currentSeverity);
                        } else {
                            alert(res.msg);
                        }
                    }
                });
            }
        }

        $(function() {
            loadVulns(1, '');
        });
    </script>
</body>
</html>
