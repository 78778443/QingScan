<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务管理 - QingScan</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <style>
        body { background: #f5f5f5; }
        .navbar { margin-bottom: 20px; }
        .content { background: #fff; padding: 20px; border-radius: 4px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">QingScan</a>
            <div class="navbar-nav mr-auto">
                <a class="nav-link" href="/">首页</a>
                <a class="nav-link active" href="/tasks">任务管理</a>
                <a class="nav-link" href="/hosts">资产发现</a>
                <a class="nav-link" href="/vulns">漏洞管理</a>
                <a class="nav-link" href="/apps">应用管理</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="content">
            <div class="table-toolbar">
                <button class="btn btn-primary" data-toggle="modal" data-target="#newTaskModal">新建任务</button>
            </div>

            <table class="table table-striped" id="taskTable">
                <thead>
                    <tr>
                        <th><input type="checkbox"></th>
                        <th>ID</th>
                        <th>任务名称</th>
                        <th>类型</th>
                        <th>目标</th>
                        <th>状态</th>
                        <th>进度</th>
                        <th>结果数</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="taskList"></tbody>
            </table>

            <nav>
                <ul class="pagination" id="pagination"></ul>
            </nav>
        </div>
    </div>

    <!-- 新建任务模态框 -->
    <div class="modal fade" id="newTaskModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">新建扫描任务</h4>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="newTaskForm">
                        <div class="form-group">
                            <label>任务名称</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="form-group">
                            <label>扫描类型</label>
                            <select class="form-control" name="type" required>
                                <option value="host">主机扫描</option>
                                <option value="web">Web扫描</option>
                                <option value="code">代码审计</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>目标</label>
                            <input type="text" class="form-control" name="target" placeholder="IP/域名/URL" required>
                        </div>
                        <div class="form-group">
                            <label>扫描工具(可选)</label>
                            <input type="text" class="form-control" name="tools" placeholder="nuclei,xray">
                            <small class="form-text text-muted">多个工具用逗号分隔</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveTask">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/bootstrap.min.js"></script>
    <script>
        var currentPage = 1;
        var token = localStorage.getItem('token');

        if(!token) {
            window.location.href = '/login';
        }

        function loadTasks(page) {
            $.get('/api/tasks?page=' + page + '&page_size=10', function(res) {
                if(res.code === 0) {
                    renderTasks(res.data.list);
                    renderPagination(res.data.total, res.data.page);
                }
            });
        }

        function renderTasks(tasks) {
            var html = '';
            var statusMap = {0: '<span class="badge badge-secondary">待执行</span>', 1: '<span class="badge badge-primary">执行中</span>', 2: '<span class="badge badge-success">已完成</span>', 3: '<span class="badge badge-danger">失败</span>'};

            tasks.forEach(function(task) {
                html += '<tr>';
                html += '<td><input type="checkbox" value="' + task.id + '"></td>';
                html += '<td>' + task.id + '</td>';
                html += '<td>' + task.name + '</td>';
                html += '<td>' + task.type + '</td>';
                html += '<td>' + task.target + '</td>';
                html += '<td>' + statusMap[task.status] + '</td>';
                html += '<td><div class="progress"><div class="progress-bar" style="width:' + task.progress + '%">' + task.progress + '%</div></div></td>';
                html += '<td>' + task.result_count + '</td>';
                html += '<td>' + task.created_at + '</td>';
                html += '<td>';
                if(task.status === 0) {
                    html += '<button class="btn btn-sm btn-primary" onclick="startTask(' + task.id + ')">开始</button> ';
                }
                if(task.status === 1) {
                    html += '<button class="btn btn-sm btn-danger" onclick="stopTask(' + task.id + ')">停止</button> ';
                }
                html += '<button class="btn btn-sm btn-danger" onclick="deleteTask(' + task.id + ')">删除</button>';
                html += '</td></tr>';
            });
            $('#taskList').html(html);
        }

        function renderPagination(total, page) {
            var pages = Math.ceil(total / 10);
            var html = '';
            for(var i = 1; i <= pages; i++) {
                html += '<li class="page-item ' + (i === page ? 'active' : '') + '"><a class="page-link" href="javascript:loadTasks(' + i + ')">' + i + '</a></li>';
            }
            $('#pagination').html(html);
        }

        $('#saveTask').click(function() {
            var data = {
                name: $('#newTaskForm input[name=name]').val(),
                type: $('#newTaskForm select[name=type]').val(),
                target: $('#newTaskForm input[name=target]').val(),
                tools: $('#newTaskForm input[name=tools]').val()
            };

            $.ajax({
                url: '/api/tasks',
                method: 'POST',
                headers: {'Authorization': 'Bearer ' + token},
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(res) {
                    if(res.code === 0) {
                        $('#newTaskModal').modal('hide');
                        loadTasks(currentPage);
                    } else {
                        alert(res.msg);
                    }
                }
            });
        });

        function startTask(id) {
            $.ajax({
                url: '/api/tasks/' + id + '/start',
                method: 'POST',
                headers: {'Authorization': 'Bearer ' + token},
                success: function(res) {
                    if(res.code === 0) {
                        loadTasks(currentPage);
                    } else {
                        alert(res.msg);
                    }
                }
            });
        }

        function stopTask(id) {
            $.ajax({
                url: '/api/tasks/' + id + '/stop',
                method: 'POST',
                headers: {'Authorization': 'Bearer ' + token},
                success: function(res) {
                    if(res.code === 0) {
                        loadTasks(currentPage);
                    } else {
                        alert(res.msg);
                    }
                }
            });
        }

        function deleteTask(id) {
            if(confirm('确定要删除这个任务吗?')) {
                $.ajax({
                    url: '/api/tasks/' + id,
                    method: 'DELETE',
                    headers: {'Authorization': 'Bearer ' + token},
                    success: function(res) {
                        if(res.code === 0) {
                            loadTasks(currentPage);
                        } else {
                            alert(res.msg);
                        }
                    }
                });
            }
        }

        $(function() {
            loadTasks(1);
        });
    </script>
</body>
</html>
