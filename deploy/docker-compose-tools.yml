version: '3.8'

services:
  # 扫描工具容器 (只包含工具)
  tools:
    image: qingscan-tools
    container_name: qingscan-tools
    hostname: qingscan-tools
    volumes:
      - tools-data:/opt/qingscan/tools
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - qingnet

  # Redis 队列
  redis:
    image: redis:7-alpine
    container_name: qingscan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - qingnet

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: qingscan-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: qingscan
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - qingnet

networks:
  qingnet:
    driver: bridge

volumes:
  tools-data:
  redis-data:
  mysql-data:
