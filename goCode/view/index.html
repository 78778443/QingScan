<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - 批量漏洞挖掘平台</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
    <style>
        body { background: #f5f5f5; }
        .navbar { margin-bottom: 20px; }
        .sidebar { background: #fff; padding: 20px; border-radius: 4px; }
        .content { background: #fff; padding: 20px; border-radius: 4px; }
        .stat-card { text-align: center; padding: 20px; background: #f8f9fa; border-radius: 4px; margin-bottom: 20px; }
        .stat-card h3 { margin: 0; font-size: 32px; }
        .stat-card p { margin: 5px 0 0; color: #666; }
        .table-toolbar { margin-bottom: 15px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">QingScan</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tasks">任务管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/hosts">资产发现</a></li>
                    <li class="nav-item"><a class="nav-link" href="/vulns">漏洞管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/apps">应用管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tools">工具配置</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/logout">退出</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2">
                <div class="sidebar">
                    <h5>快速导航</h5>
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="/tasks/new">新建任务</a></li>
                        <li class="nav-item"><a class="nav-link" href="/hosts/new">添加资产</a></li>
                        <li class="nav-item"><a class="nav-link" href="/vulns">漏洞列表</a></li>
                    </ul>
                </div>
            </div>
            <div class="col-md-10">
                <div class="content">
                    <h2>欢迎使用 QingScan</h2>
                    <p>批量漏洞挖掘平台 - 聚合扫描器</p>

                    <div class="row" style="margin-top: 30px;">
                        <div class="col-md-3">
                            <div class="stat-card">
                                <h3 id="hostCount">-</h3>
                                <p>主机数量</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <h3 id="domainCount">-</h3>
                                <p>域名数量</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <h3 id="vulnCount">-</h3>
                                <p>漏洞数量</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <h3 id="taskCount">-</h3>
                                <p>任务数量</p>
                            </div>
                        </div>
                    </div>

                    <h4 style="margin-top: 30px;">最近任务</h4>
                    <table class="table table-striped" id="recentTasks">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>任务名称</th>
                                <th>类型</th>
                                <th>目标</th>
                                <th>状态</th>
                                <th>进度</th>
                                <th>创建时间</th>
                            </tr>
                        </thead>
                        <tbody id="taskList">
                            <tr><td colspan="7" class="text-center">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/bootstrap.min.js"></script>
    <script>
        $(function() {
            // 获取统计数据
            $.get('/api/stats/assets', function(res) {
                if(res.code === 0) {
                    $('#hostCount').text(res.data.host_count);
                    $('#domainCount').text(res.data.domain_count);
                    $('#vulnCount').text(res.data.vuln_count);
                }
            });

            // 获取最近任务
            $.get('/api/tasks?page=1&page_size=5', function(res) {
                if(res.code === 0 && res.data.list.length > 0) {
                    var html = '';
                    res.data.list.forEach(function(task) {
                        var statusMap = {0: '待执行', 1: '执行中', 2: '已完成', 3: '失败'};
                        html += '<tr>';
                        html += '<td>' + task.id + '</td>';
                        html += '<td>' + task.name + '</td>';
                        html += '<td>' + task.type + '</td>';
                        html += '<td>' + task.target + '</td>';
                        html += '<td>' + statusMap[task.status] + '</td>';
                        html += '<td>' + task.progress + '%</td>';
                        html += '<td>' + task.created_at + '</td>';
                        html += '</tr>';
                    });
                    $('#taskList').html(html);
                }
            });
        });
    </script>
</body>
</html>
